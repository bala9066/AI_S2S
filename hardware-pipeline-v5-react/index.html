<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hardware Pipeline</title>
    <!-- No external CDN dependencies -->
  </head>
  <body>
    <div id="root">
      <!-- Pre-React loading indicator — replaced when React mounts -->
      <div id="pre-react-loader" style="min-height:100vh;background:#070b14;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'DM Mono',monospace;gap:16px;">
        <div style="font-size:22px;font-weight:800;color:#e2e8f0;letter-spacing:0.04em;">Hardware <span style="color:#00c6a7;">Pipeline</span></div>
        <div style="display:flex;align-items:center;gap:10px;color:#64748b;font-size:12px;">
          <div style="width:12px;height:12px;border-radius:50%;border:2px solid #00c6a7;border-top-color:transparent;animation:spin 0.8s linear infinite;"></div>
          Loading application...
        </div>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
